    <animate attributeName="opacity"
             values="0;0;1;1"
             keyTimes="0;0.35;0.37;1"
             dur="16s"
             repeatCount="indefinite"/>

    <animateTransform attributeName="transform"
                      type="translate"
                      values="0,-255;0,-255;0,0;0,0"
                      keyTimes="0;0.35;0.41;1"
                      dur="16s"
                      repeatCount="indefinite"/>
  </g>

  <!-- STM32 -->
  <g opacity="0">
    <rect x="140" y="340" width="240" height="50" rx="10" fill="#03234B"/>
    <text x="260" y="365"
          fill="white"
          font-family="Arial, sans-serif"
          font-size="17"
          font-weight="600"
          text-anchor="middle"
          dominant-baseline="middle">
      STM32
    </text>

    <animate attributeName="opacity"
             values="0;0;1;1"
             keyTimes="0;0.45;0.47;1"
             dur="16s"
             repeatCount="indefinite"/>

    <animateTransform attributeName="transform"
                      type="translate"
                      values="0,-200;0,-200;0,0;0,0"
                      keyTimes="0;0.45;0.51;1"
                      dur="16s"
                      repeatCount="indefinite"/>
  </g>

  <!-- ESP32 -->
  <g opacity="0">
    <rect x="140" y="285" width="240" height="50" rx="10" fill="#e7352c"/>
    <text x="260" y="310"
          fill="white"
          font-family="Arial, sans-serif"
          font-size="17"
          font-weight="600"
          text-anchor="middle"
          dominant-baseline="middle">
      ESP32
    </text>

    <animate attributeName="opacity"
             values="0;0;1;1"
             keyTimes="0;0.55;0.57;1"
             dur="16s"
             repeatCount="indefinite"/>

    <animateTransform attributeName="transform"
                      type="translate"
                      values="0,-145;0,-145;0,0;0,0"
                      keyTimes="0;0.55;0.61;1"
                      dur="16s"
                      repeatCount="indefinite"/>
  </g>

  <!-- C -->
  <g opacity="0">
    <rect x="140" y="230" width="240" height="50" rx="10" fill="#00599c"/>
    <text x="260" y="255"
          fill="white"
          font-family="Arial, sans-serif"
          font-size="17"
          font-weight="600"
          text-anchor="middle"
          dominant-baseline="middle">
      C
    </text>

    <animate attributeName="opacity"
             values="0;0;1;1"
             keyTimes="0;0.65;0.67;1"
             dur="16s"
             repeatCount="indefinite"/>

    <animateTransform attributeName="transform"
                      type="translate"
                      values="0,-90;0,-90;0,0;0,0"
                      keyTimes="0;0.65;0.71;1"
                      dur="16s"
                      repeatCount="indefinite"/>
  </g>

  <!-- C++ -->
  <g opacity="0">
    <rect x="140" y="175" width="240" height="50" rx="10" fill="#004482"/>
    <text x="260" y="200"
          fill="white"
          font-family="Arial, sans-serif"
          font-size="17"
          font-weight="600"
          text-anchor="middle"
          dominant-baseline="middle">
      C++
    </text>

    <animate attributeName="opacity"
             values="0;0;1;1"
             keyTimes="0;0.75;0.77;1"
             dur="16s"
             repeatCount="indefinite"/>

    <animateTransform attributeName="transform"
                      type="translate"
                      values="0,-55;0,-55;0,0;0,0"
                      keyTimes="0;0.75;0.81;1"
                      dur="16s"
                      repeatCount="indefinite"/>
  </g>

</svg>
