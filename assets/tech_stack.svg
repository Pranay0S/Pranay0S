<svg width="520" height="620" viewBox="0 0 520 620" xmlns="http://www.w3.org/2000/svg">

  <rect width="520" height="620" rx="22" fill="#0d1117"/>

  <text x="260" y="45"
        fill="#f0f6fc"
        font-family="Segoe UI, Arial, sans-serif"
        font-size="24"
        font-weight="700"
        text-anchor="middle">
    Tech Stack
  </text>

  <text x="260" y="70"
        fill="#8b949e"
        font-family="Segoe UI, Arial, sans-serif"
        font-size="13"
        text-anchor="middle">
    Embedded systems, firmware and software
  </text>

  <!-- Open-top stack outline -->
  <path d="M120 120 V550 H400 V120"
        fill="none"
        stroke="#30363d"
        stroke-width="3"/>

  <!-- Data Structures -->
  <g opacity="0">
    <rect x="140" y="475" width="240" height="55" rx="10" fill="#374151"/>
    <text x="260" y="503"
          fill="white"
          font-family="Segoe UI, Arial, sans-serif"
          font-size="17"
          font-weight="600"
          text-anchor="middle"
          dominant-baseline="middle">
      Data Structures
    </text>

    <animate
      attributeName="opacity"
      values="0;0;1;1"
      keyTimes="0;0.05;0.07;1"
      dur="12s"
      repeatCount="indefinite"/>

    <animateTransform
      attributeName="transform"
      type="translate"
      values="0,-380;0,-380;0,0;0,0"
      keyTimes="0;0.05;0.12;1"
      dur="12s"
      repeatCount="indefinite"/>
  </g>

  <!-- Memory Management -->
  <g opacity="0">
    <rect x="140" y="415" width="240" height="55" rx="10" fill="#4b5563"/>
    <text x="260" y="443"
