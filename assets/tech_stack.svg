<svg width="520" height="690" viewBox="0 0 520 690" xmlns="http://www.w3.org/2000/svg">

  <rect width="520" height="690" rx="22" fill="#0d1117"/>

  <text x="260"
        y="45"
        fill="#f0f6fc"
        font-family="Arial, sans-serif"
        font-size="24"
        font-weight="700"
        text-anchor="middle">
    Tech Stack
  </text>

  <text x="260"
        y="70"
        fill="#8b949e"
        font-family="Arial, sans-serif"
        font-size="13"
        text-anchor="middle">
    Embedded systems, firmware and software
  </text>

  <!-- Open-top stack outline -->
  <path d="M120 150 V630 H400 V150"
        fill="none"
        stroke="#30363d"
        stroke-width="3"/>

  <!-- Data Structures -->
  <g opacity="0">
    <rect x="140" y="560" width="240" height="50" rx="10" fill="#374151"/>
    <text x="260" y="585"
          fill="white"
          font-family="Arial, sans-serif"
          font-size="17"
          font-weight="600"
          text-anchor="middle"
          dominant-baseline="middle">
      Data Structures
    </text>

    <animate attributeName="opacity"
             values="0;0;1;1"
             keyTimes="0;0.05;0.07;1"
             dur="16s"
             repeatCount="indefinite"/>

    <animateTransform attributeName="transform"
                      type="translate"
                      values="0,-420;0,-420;0,0;0,0"
                      keyTimes="0;0.05;0.11;1"
                      dur="16s"
                      repeatCount="indefinite"/>
  </g>

  <!-- Memory Management -->
  <g opacity="0">
    <rect x="140" y="505" width="240" height="50" rx="10" fill="#4b5563"/>
    <text x="260" y="530"
          fill="white"
          font-family="Arial, sans-serif"
          font-size="16"
          font-weight="600"
          text-anchor="middle"
          dominant-baseline="middle">
      Memory Management
    </text>

    <animate attributeName="opacity"
             values="0;0;1;1"
             keyTimes="0;0.15;0.17;1"
             dur="16s"
             repeatCount="indefinite"/>

    <animateTransform attributeName="transform"
                      type="translate"
                      values="0,-365;0,-365;0,0;0,0"
                      keyTimes="0;0.15;0.21;1"
                      dur="16s"
                      repeatCount="indefinite"/>
  </g>

  <!-- EEPROM -->
  <g opacity="0">
    <rect x="140" y="450" width="240" height="50" rx="10" fill="#6b7280"/>
    <text x="260" y="475"
          fill="white"
          font-family="Arial, sans-serif"
          font-size="17"
          font-weight="600"
          text-anchor="middle"
          dominant-baseline="middle">
      EEPROM
    </text>

    <animate attributeName="opacity"
             values="0;0;1;1"
             keyTimes="0;0.25;0.27;1"
             dur="16s"
             repeatCount="indefinite"/>

    <animateTransform attributeName="transform"
                      type="translate"
                      values="0,-310;0,-310;0,0;0,0"
                      keyTimes="0;0.25;0.31;1"
                      dur="16s"
                      repeatCount="indefinite"/>
  </g>

  <!-- AVR -->
  <g opacity="0">
    <rect x="140" y="395" width="240" height="50" rx="10" fill="#8b5cf6"/>
    <text x="260" y="420"
          fill="white"
          font-family="Arial, sans-serif"
          font-size="17"
          font-weight="600"
          text-anchor="middle"
          dominant-baseline="middle">
      AVR
